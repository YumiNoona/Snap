name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify source and editor behavior
        run: |
          npm run check:source
          npm test -- --maxWorkers=2

      - name: Verify native behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 9.4.1 improves masks, media handling, custom cursors and preview playback.

            - Six masks: Spotlight, Blur, Magnifier, Mosaic, Redaction and Color focus. Shared source-space positions align effects and handles through crop/zoom and cursor following. Feathered alpha mattes, expansion and applicable inversion controls improve area selection; the lens no longer blurs the whole picture. Redaction stays opaque without fades.
            - Masks have individual timeline rows. Split masks no longer fade at the internal cut, and animated poses survive start trimming. Stacked effects sample the previous result. Sequence-timed masks also work over media in gaps.
            - Uploads & Media uses cached video posters rather than blank video tags, with graceful loading/error states and retry. Unsupported imported-video codecs get on-demand full-resolution H.264 compatibility media shared by preview/export, without replacing originals. Pointer dragging has a preview ghost, Escape/cancel cleanup, matching timeline snapping and preview drop-at-playhead support.
            - The transparent maximized-preview player has icon-only skip controls, a preview-only CC toggle and a movable, bounded dock. Preview expansion/restoration uses smooth view transitions where supported and respects reduced motion.
            - Add named custom PNG cursors to a local library, with image/name validation and adjustable tips. Every editor-open flow maximizes the window; Color & Film sits above Audio.
            - Recorder setup shows a microphone-level-driven liquid animation. Its lightweight native meter saves no audio and stops while recording, hidden/unfocused or idle.

            Validation includes frontend/native regression tests, real Chromium mask pixels and dock dragging, source checks, production builds and strict Rust linting. Recording remains native and lightweight; software recording fallback is explicit opt-in. These are rectangle/ellipse effects with cursor following and manual pose animation, not After Effects/Premiere object tracking or arbitrary path masks.

            Known capture limitation: the tested Apex Legends window reports WDA_EXCLUDEFROMCAPTURE (0x11). Snap respects Windows capture exclusion; this release does not bypass protection or guarantee Apex capture. The flag does not identify which program applied it or imply a user-facing toggle. See docs/capture.md.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
