name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 9.2.0 adds the Finish studio: reviewable transcript and quiet-audio cleanup, local cached voice polish with A/B preview, independent portrait/square/landscape layouts, non-destructive cursor repairs and loop alignment, and reusable local brand recipes.

            Fixes include project reopening permissions, caption entrance controls, modal keyboard focus, visible editor scrollbars, audio synchronization when switching polished/original sources, and export cancellation reporting. Heavy finishing work remains editor-only and original recordings remain unchanged.

            Validation: 157 frontend tests, 45 native unit tests, five real-FFmpeg integration checks, production build, source checks, and strict Rust linting. Full native end-to-end UI verification remains incomplete; review cleanup candidates and voice settings before export. Room-tail reduction is a gate, not neural dereverberation, and cursor repairs require input metadata. See EDITOR_FINISHING.md in the repository for details.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
