name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify source and editor behavior
        run: |
          npm run check:source
          npm test -- --maxWorkers=2

      - name: Verify native behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 9.4.0 adds advanced editor tools and a cleaner, consistent editing interface.

            - Color & Film includes film recipes, per-project/clip grades, timed masked adjustment layers, embedded .cube LUTs and RGB curves. Sections stay expanded without collapse arrows; Film looks and tone controls appear first, followed by scope, comparison, layers and enable controls.
            - All tool drawers use consistent 16px outer spacing. Refine has less helper text and no redundant hover tooltips, while voice, layout and reusable style controls remain available.
            - The animation graph editor supports custom easing and grouped key editing. Media cards drag onto the timeline, linked imported-video sound follows edits, and reusable nested sequences retain their internal edits.
            - Export renders exact timestamps, with optional export-only optical-flow interpolation for slow motion and low-FPS footage. It takes longer and may distort fast-moving text; original frames remain the default.
            - Automatic recording retains native pixels at 60 FPS with resolution-dependent bitrate and hardware encoding. Manual lower-load settings remain available. Display capture recovers transient resets without unnecessarily exhausting hardware encoders.
            - Repository documentation is organized under docs/, with historical reviews preserved in docs/archive/. Local generated artifacts remain ignored.

            Validation includes frontend/native regression tests, source checks, production builds and strict Rust linting. Recording remains native and lightweight; software recording fallback is explicit opt-in.

            Known capture limitation: the tested Apex Legends window reports WDA_EXCLUDEFROMCAPTURE (0x11). Snap respects Windows capture exclusion; this release does not bypass protection or guarantee Apex capture. The flag does not identify which program applied it or imply a user-facing toggle. See docs/capture.md.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
