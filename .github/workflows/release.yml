name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify source and editor behavior
        run: |
          npm run check:source
          npm test -- --maxWorkers=2

      - name: Verify native behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 9.5.0 adds optional export donations and refines the recorder and media-import interface.

            - Every successfully saved MP4, WebM or GIF export shows an optional donation screen with the existing UPI QR code. Not now, Escape, the close icon and backdrop dismiss it. Your video is already saved; no payment or account is required. Failed/cancelled exports do not show it, and repeat successful exports do.
            - Donation dialogs keep keyboard focus contained, restore focus when closed, respect reduced motion, fit smaller windows and handle clipboard failures without reporting false success. Saved-file actions and optional delivery-package warnings remain available.
            - Full Screen, Custom, Window and Device card wallpapers are brighter and more colorful. Image-only filters preserve the surrounding dark UI.
            - Open media now has a centered upload icon and a single Drag and drop label at 60% opacity, inside a dashed drop zone. The separate Choose file button and format list are removed; the whole area can still be clicked or activated with the keyboard to select a file.
            - Supported native file drags highlight the drop zone without covering the library. Invalid drops show a useful message, failed imports can be retried and pending imports block duplicate file pickers and competing drops.

            Validation includes frontend/native regression tests, real-browser donation and import interaction checks, source checks and production builds. Existing masks, custom cursors, media compatibility, preview-player and microphone-meter improvements are retained. Recording remains native and lightweight; software recording fallback is explicit opt-in.

            Known capture limitation: the tested Apex Legends window reports WDA_EXCLUDEFROMCAPTURE (0x11). Snap respects Windows capture exclusion; this release does not bypass protection or guarantee Apex capture. The flag does not identify which program applied it or imply a user-facing toggle. See docs/capture.md.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
