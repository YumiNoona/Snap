name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 9.0.1 releases the heavy editor before capture, coordinates recording startup and stop, bounds export memory, protects project recovery and autosave, and fixes delivery packages, audio undo/redo, media cleanup, and user-facing errors. Hardware recording defaults remain unchanged.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
