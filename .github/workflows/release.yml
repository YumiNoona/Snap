name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 9.2.2 refines the editor with a translucent, draggable Refine panel, consistent glass menus and inspectors in both themes, and only Voice, Layouts and Presets tabs.

            Layouts now include six visual format cards, saved framing snapshots, edge crop controls and better guide spacing. Presets include preview cards, three starter styles, updating saved styles and selective application for canvas, motion, layout, captions and audio.

            Full-screen GPU capture now retries temporary display failures, retains hardware encoders after display resets, and recovers stalled duplication pipelines. Recovery limits apply to consecutive failures rather than a whole recording.

            Validation: 164 frontend tests, 49 native unit tests, two live GPU capture tests, production build and source checks. Editor interaction checks cover dragging, crop/reset, format cards, presets, responsive layouts and both themes.

            Game-specific capture remains dependent on Windows capture restrictions and GPU drivers. See FULLSCREEN_CAPTURE.md for diagnosis. Hardware encoding remains the default; software fallback requires explicit opt-in.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
