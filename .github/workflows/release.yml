name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify source and editor behavior
        run: |
          npm run check:source
          npm test -- --maxWorkers=2

      - name: Verify native behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build the three standalone editions
        shell: pwsh
        run: ./scripts/Build-Snap-Editions.ps1 -Version ((Get-Content package.json -Raw | ConvertFrom-Json).version)

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            - Three standalone editions: full Snap, Snap Recorder and Snap Editor.
            - Recording tracks no longer label trailing empty sequence time as a Gap clip.
            - Auto Clips has quieter switches, side-by-side preview/settings and a bottom moments tray.
            - Drag the output picture to reframe camera and gameplay separately; each moment retains its own framing.
            - Natural clip edges, short audio edge ramps and reused caption speech reduce abrupt cuts and duplicate processing.
            - Auto Clips and Refine have distinct navigation icons. Original timeline navigation remains available.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      - name: Upload standalone editions and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $view = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Published release lookup failed.' }
          foreach ($file in Get-ChildItem -LiteralPath "release-artifacts/v$version" -File | Where-Object { $_.Name -match '\.exe(\.sha256)?$' }) {
            if (@($view.assets | Where-Object { $_.name -eq $file.Name }).Count) {
              Write-Host "Keeping existing asset $($file.Name)."
            } else {
              gh release upload $tag $file.FullName --repo $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Upload failed: $($file.Name)" }
            }
          }
