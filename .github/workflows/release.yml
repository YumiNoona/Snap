name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Verify source and editor behavior
        run: |
          npm run check:source
          npm test -- --maxWorkers=2

      - name: Verify native behavior
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 9.3.0 brings consistent Refine-style glass surfaces across editor tools, cards, menus and dialogs in dark and light themes.

            - Select keyframes with a rectangle, then move, copy, paste, duplicate, delete or ease them together. Track menus and locks protect edits, and timeline markers are easier to see.
            - Imported backgrounds appear in the Images grid. Wallpaper previews fill their cards without repeating edge strips.
            - Fixes opening exported files and uploaded media. Export completion stays visible if Windows cannot open a player, with a Show in folder action.
            - Window previews work for static windows; the picker excludes Snap and hidden helper windows and uses matching native and UI corner shapes.
            - Dropdown submenus support pointer and keyboard selection and stay within the window. Layout cards use centered illustrations and names, with less redundant text.

            Validation includes frontend and native regression tests, source checks, production builds, and browser interaction checks in both themes. Recording remains native and lightweight; hardware encoding is still the default.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
