name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 5 delivers a lighter hardware-encoded recording path and a redesigned editor with dependable timeline playback, native duration recovery, improved text, shapes, masks, gradients, camera curves, and motion blur. Offline captions now install once, remain cached on the PC, and align more closely with audible speech. File access, project saves, exports, and recording recovery also received security and reliability improvements.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
