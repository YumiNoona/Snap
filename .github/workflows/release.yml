name: Publish Snap update

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"
      - "v*"

jobs:
  publish-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, and publish the update
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Snap v__VERSION__"
          releaseBody: |
            Snap 9.2.1 simplifies the editor and window picker: one-shot window preview cards, direct selection, balanced drawer widths and padding, cleaner zoom controls, icon-based finishing tools, and source-aware timeline filmstrips without repeated clip/audio labels. The top-bar command search and its shortcut have been removed.

            Full-screen display recording now uses adapter-bound GPU Desktop Duplication. Window and region recording retain Windows Graphics Capture. Capture startup preserves diagnostics, distinguishes GPU resizing failures, and detects Windows capture-excluded windows before attempting encoding. Hardware encoding remains the default; CPU fallback is explicit opt-in.

            Validation: 163 frontend tests, 47 native unit tests, production build, source checks and strict Rust linting. Real GPU recording startup and one-shot window preview capture were also tested locally.

            Known limitation: the tested Apex Legends window reports Windows capture exclusion (WDA_EXCLUDEFROMCAPTURE, 0x11), including in Borderless Windowed mode. Snap reports this restriction and does not bypass it or silently record the desktop instead. The app or utility applying that exclusion must remove it before game-window capture can work. Some GPU drivers also reject D3D11 downscaling; use Manual / Native resolution in that case. See FULLSCREEN_CAPTURE.md for diagnosis and remaining game-specific validation.

            Install the Windows setup file below, or update directly inside Snap.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
